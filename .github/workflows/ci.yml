name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Self-test
        run: build/app/Release/modular_synth_cli.exe selftest

      - name: Benchmark (informational)
        run: build/app/Release/modular_synth_cli.exe bench

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: modular_synth-windows
          path: |
            build/app/Release/modular_synth.exe
            build/app/Release/modular_synth_cli.exe
            build/Release/Synth.exe
